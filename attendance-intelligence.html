return rows().map(r=>{const k=B[r.l]||0;let a=r.a,c=r.c;if(pol=="attended"){a+=k;c+=k}else if(pol=="absent")c+=k;const F=Rest[r.l]||0,before=r.p,now=pct(a,c);return{...r,k,now,before,F,end_all:maxPossible(a,c,F),ok:pct(a,c)>=CFG.min,rec:recoverable(a,c,F,CFG.min),need:needed(a,c,CFG.min),pol}})}

function welcome(){return`<div class="c" style="max-width:560px;margin:40px auto;text-align:center"><div class="big">Know your attendance.<br>Plan your semester.</div><p class="mu">Track, predict and protect your attendance with intelligent planning.</p><div class="row" style="justify-content:center"><input id="nm" placeholder="Your name" aria-label="Your name"></div><div class="row" style="justify-content:center"><select id="sc" aria-label="Select your section">${Object.keys(T).map(k=>`<option>${k}</option>`).join("")}</select></div><button class="pri" id="go">Get Started</button><p class="mu">Timetables for 10 SRM Tiruchirappalli sections are built in.</p></div>`}
const donut=(p,st)=>{const r=52,c=2*Math.PI*r,d=(p==null?0:Math.min(p,100))/100*c;return`<svg viewBox="0 0 130 130" width="130" role="img" aria-label="Overall attendance ${f1(p)}"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="currentColor" class="${st}" stroke-width="12" stroke-dasharray="${d} ${c}" transform="rotate(-90 65 65)" stroke-linecap="round"/><text x="65" y="71" text-anchor="middle" font-size="22" font-weight="700" fill="var(--tx)">${p==null?"–":p.toFixed(1)}</text></svg>`};
function reco(R){const o=[];R.filter(r=>r.st=="Irrecoverable").forEach(r=>o.push(`${r.name} cannot be recovered above ${CFG.min}% – speak to your faculty/HOD about condonation.`));R.filter(r=>r.st=="Danger").forEach(r=>o.push(`Attend your next ${r.n75} ${r.name} classes to move back above ${CFG.min}%.`));R.filter(r=>r.st=="Watch").forEach(r=>o.push(`${r.name} is close to ${CFG.min}% – you can safely miss ${r.safe} more.`));R.filter(r=>r.st=="Excellent"&&r.safe>0).slice(0,2).forEach(r=>o.push(`You can safely miss ${r.safe} ${r.name} classes.`));return o.length?o:["Enter your attendance to get personalised advice."]}
function dash(){const R=rows(),t=tot(R),ts=t.c?(t.p<CFG.min?"Danger":t.p<CFG.min+5?"Watch":t.p<CFG.target?"Safe":"Excellent"):"NoData",h=new Date().getHours(),g=h<12?"morning":h<17?"afternoon":"evening",risk=R.filter(r=>["Danger","Irrecoverable","Watch"].includes(r.st)),remT=R.reduce((s,r)=>s+r.F,0);
const irr=R.filter(r=>r.st=="Irrecoverable").map(r=>`<div class="alert" role="alert"><h3>⚠ IRREVERSIBLE DETENTION – ${esc(r.name)}</h3><p>Your attendance in ${esc(r.name)} is too low to recover above ${CFG.min}% even if you attend every remaining class.</p><div class="g"><div><span class="mu">Current</span><div class="big" style="font-size:22px">${f1(r.p)}</div></div><div><span class="mu">Remaining classes</span><div class="big" style="font-size:22px">${r.F}</div></div><div><span class="mu">Best possible final</span><div class="big" style="font-size:22px">${f1(r.max)}</div></div><div><span class="mu">Required</span><div class="big" style="font-size:22px">${CFG.min}%</div></div><div><span class="mu">Shortfall</span><div class="big" style="font-size:22px">${(CFG.min-r.max).toFixed(1)} pts</div></div></div><p><b>Status: cannot recover.</b></p></div>`).join("");
const d=addD(today(),0),nx=[0,1].map(i=>{const x=addD(d,i);return`<b>${DAYS[x.getDay()-1]||x.toDateString().slice(0,3)} ${x.getDate()}</b><br>`+(daySlots(S.sec,x).map(s=>`<span class="mu">${TM[(T[S.sec].tm?TM1:TM)[s.p-1]?s.p-1:0][0]}</span> ${esc(nm(S.sec,s.l))}`).join("<br>")||'<span class="mu">No classes</span>')}).join("<hr>");
return`<h2 style="margin-top:0">Good ${g}, ${esc(S.name||"Student")}</h2><p class="mu" style="margin-top:-6px">Here's your attendance health · ${S.sec} · ${T[S.sec].v}</p>${t.c?"":`<div class="c">Your attendance dashboard is waiting for your data. <button class="pri" data-t="att">Add Attendance</button></div>`}${irr}
<div class="g"><div class="c" style="display:flex;gap:14px;align-items:center;grid-column:span 2"><div class="${ts}">${donut(t.p,ts)}</div><div><h3>Overall attendance</h3><div class="big">${f1(t.p)}</div>${badge(ts)}<div class="mu">Minimum ${CFG.min}% · Target ${CFG.target}%</div></div></div><div class="c"><h3>Subjects at risk</h3><div class="big">${risk.length}</div></div><div class="c"><h3>Classes remaining</h3><div class="big">${remT}</div><div class="mu">until ${S.end}</div></div><div class="c"><h3>Classes to reach ${CFG.target}% overall</h3><div class="big">${t.c?(needed(t.a,t.c,CFG.target)>remT?"Not reachable":needed(t.a,t.c,CFG.target)):"–"}</div></div></div>

<h2>Current vs target</h2><div class="c">${R.map(r=>`<div><div class="row" style="justify-content:space-between;margin:0"><span>${esc(r.name)}</span><span class="${r.st}"><b>${f1(r.p)}</b></span></div><div class="bar"><i style="width:${Math.min(r.p||0,100)}%"></i><u style="left:${CFG.min}%"></u><s style="left:${CFG.target}%"></s></div></div>`).join("")}<div class="mu">Red line = minimum ${CFG.min}% · Green line = target ${CFG.target}%</div></div>
<h2>Subjects</h2><div class="c tw"><table><thead><tr><th>Subject</th><th>Attendance</th><th>Status</th><th>Held</th><th>Remaining</th><th>Safe absences</th><th>Need for ${CFG.min}%</th><th>Need for ${CFG.target}%</th></tr></thead><tbody>${R.map(r=>`<tr><td>${esc(r.name)}</td><td>${f1(r.p)}</td><td>${badge(r.st)}</td><td>${r.c}</td><td>${r.F}</td><td>${r.safe}</td><td>${r.n75}</td><td>${r.n90==Infinity||r.n90>r.F?"Not reachable":r.n90}</td></tr>`).join("")}</tbody></table></div>
<h2>Today &amp; tomorrow</h2><div class="c">${nx}</div>`}
function att(){const R=rows();return`<h2 style="margin-top:0">Attendance entry</h2><p class="mu">Enter classes attended and conducted so far (exact counts give exact results).</p><div class="c tw"><table><thead><tr><th>Subject</th><th>Attended</th><th>Conducted</th><th>Attendance</th></tr></thead><tbody>${R.map(r=>`<tr><td>${esc(r.name)}<div class="mu">${esc(r.fac)}</div></td><td><input type="number" min="0" data-a="${r.l}" value="${r.a}" aria-label="${esc(r.name)} attended"></td><td><input type="number" min="0" data-c="${r.l}" value="${r.c}" aria-label="${esc(r.name)} conducted"></td><td>${f1(r.p)}</td></tr>`).join("")}</tbody></table></div><p class="mu">Only have a percentage? Enter conducted classes, then attended ≈ % × conducted ÷ 100.</p><div id="attmsg" class="mu" role="status"></div>`}
function tt(){const g=grid(S.sec),tm=T[S.sec].tm?TM1:TM;return`<h2 style="margin-top:0">${S.sec} timetable <span class="mu">· ${T[S.sec].v}</span></h2><div class="c tw"><table class="tt"><thead><tr><th>Period</th>${DAYS.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${tm.map((t,i)=>`<tr><td><b>${i+1}</b><small>${t[0]}–${t[1]}</small></td>${g.map(r=>{const l=r[i];return`<td>${l=="-"?(i==4?"<small>Lunch</small>":""):esc(nm(S.sec,l))}</td>`}).join("")}</tr>`).join("")}</tbody></table></div><h2>Subjects &amp; faculty</h2><div class="c tw"><table><tbody>${letters(S.sec).map(l=>`<tr><td>${l}</td><td>${esc(nm(S.sec,l))}</td><td class="mu">${esc(T[S.sec].s[l][0])}</td><td>${esc(T[S.sec].s[l][1])}</td></tr>`).join("")}</tbody></table></div><p class="mu">Each period counts as one class (a 2-period lab = 2 classes). Slot rooms default to the section venue.</p>`}
function plan(){return`<h2 style="margin-top:0">Future date planner</h2><div class="c"><div class="row">What if I check my attendance on <input type="date" id="pd" min="${ymd(today())}" max="${S.end}" value="${window.pdv||S.end}" aria-label="Future date"></div><div class="row">I attend <input type="range" id="pp" min="0" max="100" value="${window.ppv??100}" aria-label="Percent of upcoming classes attended"> <b id="ppl">${window.ppv??100}%</b> of classes until then</div></div><div id="pout"></div>`}
function planOut(){const dv=document.getElementById("pd").value,p=+document.getElementById("pp").value;document.getElementById("ppl").textContent=p+"%";window.pdv=dv;window.ppv=p;const to=pd(dv),from=addD(today(),1),B=to<from?{}:between(S.sec,from,to),R=rows(),rest=to<from?remCounts():between(S.sec,addD(to,1),pd(S.end));let n=0;const body=R.map(r=>{const k=B[r.l]||0,fa=Math.round(k*p/100),a=r.a+fa,c=r.c+k;n+=k;const s=status(a,c,rest[r.l]||0);return`<tr><td>${esc(r.name)}</td><td>${k}</td><td>${f1(pct(a,c))}</td><td>${badge(s)}</td><td>${safeAbs(a,c,rest[r.l]||0,CFG.min)}</td><td>${needed(a,c,CFG.min)}</td></tr>`}).join("");document.getElementById("pout").innerHTML=`<h2>${n} classes occur before ${dv}</h2><div class="c tw"><table><thead><tr><th>Subject</th><th>Classes</th><th>Projected</th><th>Status</th><th>Safe absences after</th><th>Need for ${CFG.min}%</th></tr></thead><tbody>${body}</tbody></table></div>`}
function sim(){const t=ymd(addD(today(),1));return`<h2 style="margin-top:0">Leave / OD / Medical simulator</h2><div class="c"><div class="row"><select id="st" aria-label="Type"><option value="leave">Leave (absent)</option><option value="od">On-Duty</option><option value="med">Medical leave</option></select> from <input type="date" id="sf" value="${t}"> to <input type="date" id="se" value="${t}"></div><p class="mu">OD policy: <b>${S.od}</b> · Medical policy: <b>${S.med}</b> (change in Settings)</p></div><div id="sout"></div>`}
function simOut(){const f=pd(document.getElementById("sf").value),e=pd(document.getElementById("se").value),ty=document.getElementById("st").value;if(e<f){document.getElementById("sout").innerHTML=`<div class="c">The end date must be on or after the start date.</div>`;return}const L=leave(f,e,ty),bad=L.filter(x=>x.k&&!x.ok&&x.now<x.before),still=L.filter(x=>x.k&&!x.ok&&!(x.now<x.before)),k=L.reduce((s,x)=>s+x.k,0);document.getElementById("sout").innerHTML=`<h2>${k} classes affected · Risk: ${bad.length?'<span class="Danger">HIGH</span>':L.some(x=>x.k&&x.now<CFG.min+5)?'<span class="Watch">MEDIUM</span>':'<span class="Safe">LOW</span>'}</h2><div class="c tw"><table><thead><tr><th>Subject</th><th>Classes affected</th><th>Before</th><th>After</th><th>Change</th><th>Status</th></tr></thead><tbody>${L.filter(x=>x.k).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.k}</td><td>${f1(x.before)}</td><td>${f1(x.now)}</td><td>${x.before==null?"–":(x.now-x.before>=0?"+":"")+(x.now-x.before).toFixed(1)}</td><td>${x.ok?badge("Safe"):badge(x.rec?"Danger":"Irrecoverable")}</td></tr>`).join("")||'<tr><td colspan=6>No classes fall on these dates.</td></tr>'}</tbody></table></div><div class="c" style="margin-top:12px"><b>Recommendation:</b> ${bad.length?"Not recommended — "+bad.map(x=>x.name).join(", ")+" would lose attendance and end up below "+CFG.min+"%.":(still.length?"This does not lower your attendance, but "+still.map(x=>x.name+" is still below "+CFG.min+"% (needs "+x.need+" more classes)").join("; ")+".":"Looks safe for "+CFG.min+"%.")}</div>`}
function set(){const o=(v,c)=>["attended","excluded","absent"].map(x=>`<option ${x==c?"selected":""}>${x}</option>`).join("");return`<h2 style="margin-top:0">Settings</h2><div class="c"><div class="row"><label>Name <input id="s_n" value="${esc(S.name)}"></label></div><div class="row"><label>Section <select id="s_s">${Object.keys(T).map(k=>`<option ${k==S.sec?"selected":""}>${k}</option>`).join("")}</select></label></div><div class="row"><label>Semester start <input type="date" id="s_a" value="${S.start}"></label><label>Semester end <input type="date" id="s_b" value="${S.end}"></label></div><div class="row"><label>Minimum % <input type="number" id="s_m" value="${CFG.min}"></label><label>Target % <input type="number" id="s_t" value="${CFG.target}"></label></div><div class="row"><label>OD counts as <select id="s_o">${o(0,S.od)}</select></label><label>Medical leave counts as <select id="s_e">${o(0,S.med)}</select></label></div><div class="row"><label>Holidays / excluded dates (comma-separated, YYYY-MM-DD)<br><input id="s_h" style="width:100%" value="${S.hol.join(", ")}"></label></div><div class="row"><button class="pri" id="s_save">Save</button><button id="s_reset">Reset everything</button></div><div id="smsg" class="mu" role="status"></div></div>`}
/* ===== FREE ADVISOR (rule-based; uses the same engine, never invents numbers) ===== */
const MON=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"],WD=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
function findSub(q,R){let best=null,sc=0;R.forEach(r=>{const w=(r.name+" "+T[S.sec].s[r.l][0]).toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>=3&&!["and","for","the","lab"].includes(x));let s=w.filter(x=>q.includes(x)).length;if(/\blab\b/.test(q)&&/lab/i.test(r.name))s+=1;if(/\blab\b/.test(r.name.toLowerCase())&&!/\blab\b/.test(q))s-=.5;if(s>sc){sc=s;best=r}});return best}
function parseDate(q){const t=today();if(/tomorrow/.test(q))return addD(t,1);if(/\btoday\b/.test(q))return t;let m=q.match(/next (sunday|monday|tuesday|wednesday|thursday|friday|saturday)/);if(m){let d=addD(t,1);while(WD[d.getDay()]!=m[1]||+d<+addD(t,7)-6*864e5*0&&false)d=addD(d,1);if(d<=addD(t,0))d=addD(d,7);let x=addD(t,1);while(WD[x.getDay()]!=m[1])x=addD(x,1);return /next/.test(q)&&(x-t)/864e5<=1&&false?x:addD(x,x.getDay()==t.getDay()?7:0)}
m=q.match(/(\d{1,2})(?:st|nd|rd|th)?\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/);if(m)return new Date(t.getFullYear(),MON.indexOf(m[2]),+m[1]);return null}
function advise(q0){const q=q0.toLowerCase(),R=rows(),t=tot(R),sub=findSub(q,R),out=(a,c,r,rec)=>({a,c,r,rec});
if(!t.c)return out("I don't have any attendance yet.","–","–","Open the Attendance tab and enter attended/conducted classes for each subject.");
if(/leave|sick|medical|absent|miss(?!.*classes can)|\bod\b|on.?duty|skip/.test(q)&&!/how many/.test(q)){const ty=/\bod\b|on.?duty/.test(q)?"od":/sick|medical|fever|ill/.test(q)?"med":"leave";let st=parseDate(q)||addD(today(),1),m=q.match(/(\d+)\s*-?\s*day/),n=m?+m[1]:/week/.test(q)?7:1,en=addD(st,n-1);const L=leave(st,en,ty),k=L.reduce((s,x)=>s+x.k,0),aff=sub?L.filter(x=>x.l==sub.l):L.filter(x=>x.k),bad=L.filter(x=>x.k&&!x.ok&&x.now<x.before),unrec=L.filter(x=>x.k&&!x.rec&&x.now<x.before);

const calc=aff.map(x=>`${x.name}: ${x.k} class(es) · ${f1(x.before)} → ${f1(x.now)} (${x.a}/${x.c} → after policy "${x.pol}")`).join("\n");
let ans=sub?(()=>{const x=L.find(y=>y.l==sub.l);return x.k?`${ty=="leave"?"Leave":ty=="od"?"OD":"Medical leave"} of ${n} day(s) from ${ymd(st)} affects ${x.k} ${x.name} class(es) and moves it from ${f1(x.before)} to ${f1(x.now)} – ${x.ok?"still":"below"} the ${CFG.min}% threshold.`:`No ${x.name} classes fall in ${ymd(st)}–${ymd(en)}.`})():`${n}-day ${ty} from ${ymd(st)} affects ${k} classes. ${bad.length?bad.map(x=>x.name+" drops to "+f1(x.now)).join("; ")+" (below "+CFG.min+"%).":L.some(x=>x.k&&!x.ok)?"No subject loses attendance, but "+L.filter(x=>x.k&&!x.ok).map(x=>x.name).join(", ")+" remain below "+CFG.min+"%.":"All subjects stay at or above "+CFG.min+"%."}`;
const rc=bad.length?`Avoid this leave, or compensate: ${bad.map(x=>"attend the next "+x.need+" "+x.name+" classes").join(", ")}.${unrec.length?" "+unrec.map(x=>x.name).join(", ")+" would become unrecoverable.":""}`:"You can take it. Keep watching the subjects closest to the limit.";return out(ans,calc,risk,rc)}
if(/can i (reach|get|hit)|reach 9|90/.test(q)){const list=(sub?[sub]:R).map(r=>`${r.name}: needs ${r.n90==Infinity?"∞":r.n90} of ${r.F} remaining → ${r.n90<=r.F?"reachable":"NOT reachable"} (best possible ${f1(r.max)})`);const no=(sub?[sub]:R).filter(r=>r.n90>r.F);return out(no.length?`${no.length?no.map(r=>r.name).join(", "):""} cannot reach ${CFG.target}% before ${S.end}.`:`Yes – ${CFG.target}% is reachable in ${sub?sub.name:"every subject"} if you attend the required classes.`,list.join("\n"),no.length?"MEDIUM":"LOW","Prioritise the subjects with the biggest \"needed\" number first.")}
if(/how many.*(miss|skip)|can i miss|safe/.test(q)&&!/leave/.test(q)){const l=(sub?[sub]:R).map(r=>`${r.name}: ${r.safe} safe absence(s) (${r.a}/${r.c}, ${r.F} classes left)`);return out(sub?`You can miss ${sub.safe} more ${sub.name} class(es) and stay ≥ ${CFG.min}%, assuming you attend the rest.`:`Safe absences per subject are listed below.`,l.join("\n"),sub?(sub.st=="Danger"||sub.st=="Irrecoverable"?"HIGH":sub.safe<=1?"MEDIUM":"LOW"):"–","Use safe absences sparingly; keep a buffer for illness.")}

if(/week|need.*attend|must attend/.test(q)){const from=addD(today(),1),B=between(S.sec,from,addD(from,6)),l=R.filter(r=>B[r.l]).map(r=>`${r.name}: ${B[r.l]} class(es) this week · need ${r.n75} to reach ${CFG.min}% → ${r.n75>0?"attend all "+Math.min(B[r.l],r.n75):"no must-attend"}`);const must=R.filter(r=>r.n75>0&&B[r.l]);return out(must.length?`Attend every class this week for: ${must.map(r=>r.name).join(", ")}.`:`No subject forces you to attend every class this week.`,l.join("\n"),must.length?"MEDIUM":"LOW","Keep buffers for sudden absences.")}

return out(`Overall attendance is ${f1(t.p)} (${t.a}/${t.c}).`,`${R.filter(r=>r.st=="Danger"||r.st=="Irrecoverable").length} subject(s) in danger · ${R.reduce((s,r)=>s+r.F,0)} classes remaining until ${S.end}`,t.p<CFG.min?"HIGH":t.p<CFG.min+5?"MEDIUM":"LOW",reco(R)[0])}

const TV=`#version 300 es

(function(){const cv=$("tun"),gl=cv.getContext("webgl2",{alpha:true,premultipliedAlpha:true,antialias:false});if(!gl)return;
const sh=(t,c)=>{const o=gl.createShader(t);gl.shaderSource(o,c);gl.compileShader(o);return o},pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,TV));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,TF));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;gl.useProgram(pr);
